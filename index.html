<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">M3U8 Player</h1>

        <div class="input-section">
            <input
                type="text"
                id="urlInput"
                placeholder="Paste your M3U8 link here..."
                spellcheck="false"
            >
            <button id="playBtn">Play</button>
        </div>

        <div class="source-section">
            <label for="sourceSelect">Player:</label>
            <select id="sourceSelect">
                <option value="hlsplayer">HLSPlayer.net</option>
                <option value="bestm3u8">BestM3U8Player</option>
                <option value="anym3u8">AnyM3U8Player</option>
                <option value="anym3u8vjs">AnyM3U8 (VideoJS)</option>
            </select>
            <button id="openTabBtn" class="open-tab-btn" hidden>Open in new tab</button>
        </div>

        <div class="player-wrapper" id="playerWrapper">
            <iframe id="playerFrame" src="about:blank"
                allowfullscreen
                allow="autoplay; encrypted-media; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                referrerpolicy="no-referrer"
            ></iframe>
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <p>Enter an M3U8 URL and press Play</p>
                </div>
            </div>
            <div id="loadingOverlay" class="overlay hidden">
                <div class="overlay-content">
                    <div class="spinner"></div>
                    <p>Loading player...</p>
                </div>
            </div>
        </div>

        <div id="fallbackMsg" class="fallback-msg" hidden>
            Player not loading? Try switching the Player source above, or
            <a id="fallbackLink" href="#" target="_blank" rel="noopener">open directly in a new tab</a>.
        </div>

        <div class="history-section" id="historySection" hidden>
            <h3>Recent Links</h3>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
